{% extends "base.html" %}

{% block title %}User Settings{% endblock %}

{% block content %}
        <h1>User Settings</h1>
        <form class="portal-form" method="post">
          {% csrf_token %}
          {% include "includes/form_errors.html" %}
          {% for field in form %}
          {% include "includes/form_field.html" with horizontal=True %}
          {% endfor %}
          <div class="row">
            <div class="col-sm-8 offset-sm-4 col-lg-9 offset-lg-3">
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </div>
        </form>
{% endblock %}
