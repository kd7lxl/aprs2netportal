# nginx reverse proxy for aprs2netportal.
#
# Copy to /etc/nginx/sites-available/t2sysop.conf (or conf.d/), adjust the
# server name and certificate paths, link it into sites-enabled, then
#
#     nginx -t && systemctl reload nginx
#
# The file is included in nginx's "http" context. The application must run
# with BEHIND_TLS_PROXY=1 and with the server name in ALLOWED_HOSTS; see
# deploy/README.md.

# At most 10 login or password reset requests a minute per client address.
# The application does not limit password guessing itself.
limit_req_zone $binary_remote_addr zone=t2login:10m rate=10r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name t2sysop.aprs2.net;

    # Certificate from Let's Encrypt, as maintained by dehydrated.
    ssl_certificate     /opt/dehydrated/certs/t2sysop.aprs2.net/fullchain.pem;
    ssl_certificate_key /opt/dehydrated/certs/t2sysop.aprs2.net/privkey.pem;

    # --- LoTW client certificate login --------------------------------------
    # Uncomment these three lines, and set LOTW_CLIENT_CERT_AUTH=1 for the
    # application, to let sysops log in with their ARRL Logbook of The World
    # certificate. lotw-roots.pem holds the current LoTW root and production
    # CA certificates, and nothing else.
    #ssl_client_certificate /etc/nginx/ssl/lotw-roots.pem;
    #ssl_verify_client      optional;
    #ssl_verify_depth       2;

    # Keep ALL proxy_set_header lines here at the server level. A location
    # with any proxy_set_header of its own stops inheriting these, which
    # would silently drop the X-SSL-Client-* lines below for that location.
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The client address for the application's access log.
    proxy_set_header X-Real-IP         $remote_addr;

    # The application trusts these two headers when LoTW login is enabled.
    # Always set them, also when it is not in use: they overwrite whatever a
    # client sends, so that nobody can claim a certificate they do not have.
    # Use $ssl_client_s_dn, not $ssl_client_s_dn_legacy.
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;

    # The application sends its own Strict-Transport-Security,
    # Content-Security-Policy, X-Frame-Options, X-Content-Type-Options and
    # Referrer-Policy headers. Do not add copies here.

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/(accounts/login|login|admin/login|accounts/password/reset)/ {
        limit_req        zone=t2login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name t2sysop.aprs2.net;

    # ACME http-01 challenges for dehydrated.
    location /.well-known/acme-challenge/ {
        alias /var/www/dehydrated/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
